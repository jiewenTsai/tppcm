# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages for the PDF manual
        run: |
          tlmgr update --self
          tlmgr install inconsolata makeindex

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--as-cran")'
          build_args: 'c("--compact-vignettes=gs+qpdf")'


      - name: Profile tests and vignette chunks (temporary)
        if: always() && runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source", quiet = TRUE)
          library(tppcm)
          cat("== test files (elapsed seconds)\n")
          for (f in list.files("tests/testthat", "^test-.*\\.R$")) {
            flt <- sub("^test-(.*)\\.R$", "\\1", f)
            t <- system.time(testthat::test_dir("tests/testthat", filter = flt,
              package = "tppcm", load_package = "installed",
              reporter = "silent", stop_on_failure = FALSE))[["elapsed"]]
            cat(sprintf("%-28s %6.1f\n", f, t))
          }
          cat("== vignette chunks over 2 s\n")
          t0 <- NULL
          knitr::knit_hooks$set(timeit = function(before, options) {
            if (before) t0 <<- Sys.time() else {
              dt <- as.numeric(difftime(Sys.time(), t0, units = "secs"))
              if (dt > 2) cat(sprintf("  %-30s %6.1f\n", options$label, dt))
            }
            NULL
          })
          knitr::opts_chunk$set(timeit = TRUE)
          for (f in list.files("vignettes", "\\.Rmd$", full.names = TRUE)) {
            cat(f, "\n")
            t <- system.time(rmarkdown::render(f, output_dir = tempdir(),
              envir = new.env(), quiet = TRUE,
              knit_root_dir = tempdir(),
              params = NULL))[["elapsed"]]
            cat(sprintf("  TOTAL %6.1f\n", t))
          }
