# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages for the PDF manual
        run: |
          tlmgr update --self
          tlmgr install inconsolata

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--as-cran")'
          build_args: 'c("--compact-vignettes=gs+qpdf")'

      - name: Show LaTeX log of the PDF manual
        if: failure()
        run: |
          R CMD Rd2pdf --no-preview --no-clean --output=manual.pdf . || true
          which makeindex || true; makeindex --version 2>&1 | head -2 || true
          for d in .Rd2pdf*; do
            echo "== $d/Rd2.ilg"; cat "$d/Rd2.ilg" || true
            echo "== $d/Rd2.log errors"; grep -n -A3 '^!' "$d/Rd2.log" | head -60 || true
            echo "== manual makeindex"; (cd "$d" && makeindex Rd2.idx; echo "exit $?") || true
            echo "== odd index entries"; grep -n '[!@|"]' "$d/Rd2.idx" | head -20 || true
          done
        shell: bash
